services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: research-chatbot-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - CHROMA_DB_PATH=/app/chroma_db
    # The backend is a pure consumer of the index: it only mounts the shared
    # ChromaDB volume and holds no ingest/chunking config of its own.
    volumes:
      - ../chroma_db:/app/chroma_db
    networks:
      - chatbot-network

  # Dedicated, self-contained image that creates the RAG index and writes it to
  # the shared volume the backend reads. Rebuild with:
  #   docker compose -f src/docker-compose.yml --profile tools run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    image: research-chatbot-ingest
    profiles: ["tools"]
    environment:
      - CHROMA_DB_PATH=/data/chroma
    volumes:
      - ../chroma_db:/data/chroma
      - ../research_papers:/data/research_papers:ro
    networks:
      - chatbot-network

  frontend:
    build: ./frontend
    container_name: research-chatbot-frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - chatbot-network

networks:
  chatbot-network:
    driver: bridge
